seed: 42
project: local2global-nmr
train: true
test: false

data_path: ${oc.env:DATA_PATH,data/uspto/preprocessed}
log_path: ${oc.env:LOG_PATH,logs}
output_dir: ${hydra:runtime.output_dir}

hidden_dim: 256
num_heads: 8
max_num_atoms: 192
local_vocab_sizes:
  6: 84
  7: 28
  8: 11
  9: 1
  16: 8
  17: 1
  35: 1
  53: 1

datamodule:
  _target_: src.data.datamodule.NMRGraphDataModule
  train_path: ${data_path}/train.pt
  val_path: ${data_path}/val.pt
  test_path: ${data_path}/test.pt
  local_vocab_path: data/uspto/label_vocab.json
  train_batch_size: 32
  val_batch_size: 64
  num_workers: 4
  pin_memory: true

lit_module:
  _target_: src.lit.module.LitNMRToGraph
  model:
    _target_: src.model.nmr_to_graph.NMRToGraph
    hidden_dim: ${hidden_dim}
    num_heads: ${num_heads}
    num_spectrum_layers: 3
    num_atom_spectrum_layers: 3
    num_atom_interaction_layers: 2
    num_fourier_features: 64
    max_num_atoms: ${max_num_atoms}
    num_bond_types: 5
    local_vocab_sizes: ${local_vocab_sizes}
    dropout: 0.1
  criterion:
    _target_: src.model.loss.NMRGraphLoss
    edge_weight: 1.0
    h_attachment_weight: 1.0
    h_count_weight: 0.25
    local_weight: 0.5
    h_entropy_weight: 0.0
    permutation_invariant_hydrogens: true
  lr: 2e-4
  weight_decay: 1e-12
  warm_up_steps: 100

callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${output_dir}/checkpoints
    filename: "{epoch:03d}"
    monitor: val/loss_weighted
    mode: min
    save_last: true
    save_top_k: 3

logger:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    save_dir: ${output_dir}
    project: ${project}
    log_model: false

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  max_epochs: 500
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2

optimized_metric: val/loss_weighted
ckpt_path: null

hydra:
  run:
    dir: ${log_path}/uspto_graph/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}

