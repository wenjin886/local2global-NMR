seed: 1729
run_test: true

data_name: uspto
exp_name: dim512-bs256
group: step-3-geoinit
exp_save_dir_name: ${exp_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
output_dir: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/exp/local2global/${data_name}/${group}/${exp_save_dir_name}
log_path: ${output_dir}/logs

data:
  parquet_paths: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/data/uspto/data4initializer
    # - data/uspto/exp_data/example_data_1.parquet
    # - data/uspto/exp_data/example_data_2.parquet
  smiles_column: smiles
  split_ratios: [0.85, 0.05, 0.1]
  split_seed: ${seed}
  train_batch_size: 256
  val_batch_size: 256
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  max_heavy_atoms: 101
  max_total_atoms: 35
  train_limit: null
  val_limit: null
  test_limit: null

model:
  hidden_dim: 512
  num_layers: 3
  dropout: 0.05
  residual_scale: 6.0
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5

  # Synthetic NMR-to-graph errors. The correct 2D graph remains the label.
  clean_margin: 4.0
  logit_noise_std: 0.4
  bond_type_confusion_probability: 0.15
  false_positive_probability: 0.03
  false_negative_probability: 0.12
  attachment_confusion_probability: 0.15
  corruption_boost: 6.0

  edge_loss_weight: 1.0
  attachment_loss_weight: 1.0
  geometry_loss_weight: 0.3
  one_three_loss_weight: 0.5
  one_four_loss_weight: 0.5
  distance_loss_weight: 0.5
  ring_loss_weight: 0.2
  conjugated_loss_weight: 0.2
  torsion_loss_weight: 0.3
  residual_loss_weight: 1.0e-3
  positive_class_weight_cap: 20.0

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 50
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  deterministic: false

checkpoint:
  save_top_k: 3

logger:
  enabled: true
  project: local2geo-hybrid
  name: ${exp_name}
  mode: online
  log_model: false

hydra:
  run:
    dir: ${log_path}