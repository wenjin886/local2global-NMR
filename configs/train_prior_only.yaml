seed: 42
project: end2end-NMR

data_path: ${oc.env:DATA_PATH}
data_name: uspto

group: step-5-end2end
exp_name: prior-only-correction-dim512
exp_save_dir_name: ${group}/${exp_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
output_dir: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/exp/local2global/${data_name}/${exp_save_dir_name}
log_path: ${output_dir}/logs
ckpt_path: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/exp/local2global/uspto/step-5-end2end/prior-only-correction-dim512_2026-08-26_20-14-04/checkpoints/last.ckpt
test: false
optimized_metric: val/corrected_graph_exact_match

nmr_to_graph_checkpoint: ${oc.env:NMR2GRAPH_CKPT}
topology_prior_checkpoint: ${oc.env:TOPOLOGY_PRIOR_CKPT}

hidden_dim: 512
max_num_atoms: 101

datamodule:
  _target_: src.data.datamodule.NMRGraphDataModule
  train_path: ${data_path}/train.pt
  val_path: ${data_path}/val.pt
  test_path: ${data_path}/test.pt
  train_batch_size: 32
  val_batch_size: 32
  num_workers: 1
  pin_memory: true
  # The full loader supplies metrics; this fixed subset supplies W&B graphs.
  val_generation_size: 9
  val_generation_seed: 0
  inference_only_validation: false
  batch_transform:
    _target_: src.data.transforms.NormalizeNMR
    stats_path: ${data_path}/dataset_infos_train.json
    normalize_h_shift: true
    normalize_c_shift: true
    normalize_h_integration: true
    normalize_h_j: true
    encode_multiplicity: false
    encode_smiles: false
    max_multiplicity_classes: 122

lit_module:
  _target_: end2end_module.prior_lit_module.PriorOnlyNMRModule
  nmr_to_graph_checkpoint: ${nmr_to_graph_checkpoint}
  topology_prior_checkpoint: ${topology_prior_checkpoint}
  checkpoint_strict: true
  corrected_edge_loss_weight: 1.0
  corrected_attachment_loss_weight: 1.0
  corrected_h_count_loss_weight: 0.25
  corrected_neighbor_overflow_loss_weight: 1.0
  corrected_carbon_valence_loss_weight: 0.25
  topology_residual_loss_weight: 1.0e-3
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  validation_examples: 9

  nmr_to_graph:
    _target_: src.model.nmr_to_graph.NMRToGraph
    hidden_dim: ${hidden_dim}
    num_heads: 8
    num_joint_layers: 6
    num_atom_interaction_layers: 2
    num_fourier_features: 64
    max_num_atoms: ${max_num_atoms}
    num_bond_types: 5
    max_fragment_count: 4
    attachment_dim: 128
    attachment_temperature: 0.1
    use_h_integration: true
    use_h_multiplicity: true
    use_h_j: true
    max_multiplicity_classes: 122
    use_smiles_loss: true
    use_smiles_conditioning: false
    use_smiles_joint_bixt: true
    smiles_memory: joint
    num_smiles_layers: 5
    max_smiles_length: 75
    smiles_vocab_path: ${data_path}/dataset_infos_train.json
    teacher_force_smiles_during_eval: false
    predict_attachments: true
    predict_edges: true
    use_graph_joint_encoder: true
    num_graph_joint_layers: 1
    dropout: 0.1

  graph_criterion:
    _target_: src.model.loss.NMRGraphLoss
    heavy_fragment_weight: 1.0
    heavy_fragment_presence_weight: 0.25
    heavy_neighbor_count_weight: 0.1
    fragment_carbon_valence_weight: 0.1
    h_parent_fragment_weight: 1.0
    h_parent_presence_weight: 0.25
    h_parent_type_weight: 0.25
    h_attachment_weight: 1.0
    h_count_weight: 0.25
    h_entropy_weight: 0.0
    edge_weight: 1.0
    edge_none_class_weight: 0.8
    edge_bond_class_weight: 1.0
    edge_total_neighbor_count_weight: 1.0
    carbon_valence_weight: 0.25
    fragment_edge_consistency_weight: 0.25
    # Raw graph loss is a frozen-model diagnostic; SMILES CE is not needed.
    smiles_weight: 0.0
    permutation_invariant_hydrogens: true

  topology_prior:
    _target_: local2geo_module.topology_prior.SoftTopologyPrior
    hidden_dim: ${hidden_dim}
    num_layers: 3
    dropout: 0.05
    residual_scale: 6.0

callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${output_dir}/checkpoints
    filename: "{epoch:03d}-{step}"
    monitor: val/corrected_graph_exact_match
    mode: max
    save_last: true
    save_top_k: 3
  learning_rate_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step

logger:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    save_dir: ${output_dir}
    project: ${project}
    group: ${group}
    name: ${exp_name}
    log_model: false

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: auto
  devices: 1
  # strategy: ddp
  max_epochs: 100
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  val_check_interval: 0.1
  num_sanity_val_steps: 0

hydra:
  run:
    dir: ${log_path}
