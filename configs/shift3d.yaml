seed: 0
output_dir: outputs/shift3d
run_test: true

data:
  data_dir: data/uspto/3d2shift
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  train_random_conformer: true
  eval_conformer_index: 0

model:
  hidden_dim: 128
  num_interactions: 6
  num_rbf: 64
  cutoff: 6.0
  dropout: 0.0
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  h_loss_weight: 1.0
  c_loss_weight: 0.1
  equivalence_loss_weight: 0.1

checkpoint:
  save_top_k: 3

logger:
  enabled: true
  project: local2global-nmr-3d2shift
  name: null
  mode: online
  log_model: false

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 100
  precision: 32-true
  gradient_clip_val: 5.0
  log_every_n_steps: 50
