[project]
name = "local2global-nmr"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "hydra-core>=1.3",
  "matplotlib>=3.5",
  "networkx>=2.8",
  "numpy<2",
  "pandas",
  "pyarrow",
  "pytorch-lightning>=1.8,<3",
  "rdkit>=2023.9",
  "rxn-chem-utils>=1.6",
  "scipy",
  "torch>=1.13",
  "tqdm",
  "wandb",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*", "local2geo_module*", "shift3d_module*", "end2end_module*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
