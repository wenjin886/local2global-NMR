seed: 0
run_test: true

data_name: uspto
exp_name: dim512-bs64
group: step-4-3d2nmr
exp_save_dir_name: ${exp_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
output_dir: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/exp/local2global/${data_name}/${group}/${exp_save_dir_name}
log_path: ${output_dir}/logs
data_path: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/data/${data_name}

ckpt_path: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/exp/local2global/uspto/step-4-3d2nmr/dim512-bs64_2026-08-24_15-36-51/checkpoints/last.ckpt

val_check_interval: 0.1
data:
  data_dir: ${data_path}/3d2shift
  batch_size: 64
  # Each complete split is already resident in the main process. Keeping
  # workers at zero avoids copying a very large Python object graph.
  num_workers: 1
  pin_memory: true
  persistent_workers: false
  shuffle_seed: ${seed}

model:
  stats_path: ${data_path}/preprocessed/dataset_infos_train.json
  hidden_dim: 512
  num_interactions: 6
  num_rbf: 64
  cutoff: 6.0
  dropout: 0.0
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  h_loss_weight: 1.0
  c_loss_weight: 1.0
  equivalence_loss_weight: 0.5
  h_huber_delta: 0.2
  c_huber_delta: 2.0
  h_outlier_cap: 2.0
  c_outlier_cap: 20.0
  h_softmin_temperature: 0.05
  c_softmin_temperature: 0.5
  log_prediction_plots: true
  prediction_plot_samples: 9
  h_plot_ppm_min: -2.0
  h_plot_ppm_max: 10.0
  c_plot_ppm_min: -16.0
  c_plot_ppm_max: 230.0

checkpoint:
  save_top_k: 3
logger:
  enabled: true
  project: local2global-nmr-3d2shift
  mode: online
  log_model: false
  name: ${exp_name}
  save_dir: ${output_dir}

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 100
  gradient_clip_val: 5.0
  log_every_n_steps: 50
  val_check_interval: ${val_check_interval}


hydra:
  run:
    dir: ${log_path}
