seed: 42
project: local2global-nmr
train: true
test: false

data_path: ${oc.env:DATA_PATH}
data_name: uspto

output_dir: /rds/projects/c/chenlv-ai-and-chemistry/wuwj/Unsupervised_NMR/exp/local2global/${data_name}
log_path: ${output_dir}

group: test
exp_name: fragment_smiles_d512
exp_save_dir_name: ${group}/${exp_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}

hidden_dim: 512
num_heads: 8
max_num_atoms: 101

datamodule:
  _target_: src.data.datamodule.NMRGraphDataModule
  train_path: ${data_path}/train.pt
  val_path: ${data_path}/val.pt
  test_path: ${data_path}/test.pt
  train_batch_size: 64
  val_batch_size: 64
  num_workers: 4
  pin_memory: true
  val_generation_size: 1024
  val_generation_seed: 0
  transform:
    _target_: src.data.transforms.NormalizeNMR
    stats_path: ${data_path}/dataset_infos_train.json
    normalize_h_shift: true
    normalize_c_shift: true
    normalize_h_integration: true
    normalize_h_j: true
    encode_multiplicity: false
    encode_smiles: false
    max_multiplicity_classes: 512

lit_module:
  _target_: src.lit.module.LitNMRToGraph
  model:
    _target_: src.model.nmr_to_graph.NMRToGraph
    hidden_dim: ${hidden_dim}
    num_heads: ${num_heads}
    num_joint_layers: 6
    num_atom_interaction_layers: 2
    num_fourier_features: 64
    max_num_atoms: ${max_num_atoms}
    num_bond_types: 5
    max_fragment_count: 4
    attachment_dim: 128
    attachment_temperature: 0.1
    use_h_integration: true
    use_h_multiplicity: true
    use_h_j: true
    max_multiplicity_classes: 512
    use_smiles_loss: true
    use_smiles_conditioning: false
    num_smiles_layers: 6
    max_smiles_length: 500
    smiles_vocab_path: ${data_path}/dataset_infos_train.json
    teacher_force_smiles_during_eval: false
    dropout: 0.1
  criterion:
    _target_: src.model.loss.NMRGraphLoss
    heavy_fragment_weight: 1.0
    heavy_fragment_presence_weight: 0.25
    h_parent_fragment_weight: 1.0
    h_parent_presence_weight: 0.25
    h_parent_type_weight: 0.25
    h_attachment_weight: 0.0
    h_count_weight: 0.0
    h_entropy_weight: 0.0
    edge_weight: 0.0
    fragment_edge_consistency_weight: 0.0
    smiles_weight: 1.0
    permutation_invariant_hydrogens: true
  lr: 2e-4
  weight_decay: 1e-12
  warm_up_steps: 100

callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${output_dir}/checkpoints
    filename: "{epoch:03d}"
    monitor: val/heavy_fragment_score
    mode: max
    save_last: true
    save_top_k: 3

logger:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    save_dir: ${output_dir}
    project: ${project}
    log_model: false
    name: ${exp_name}

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  max_epochs: 100
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2

optimized_metric: val/heavy_fragment_score
ckpt_path: null

hydra:
  run:
    dir: ${log_path}/${exp_save_dir_name}
